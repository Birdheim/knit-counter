# Bygger siden og legger den ut på GitHub Pages hver gang du pusher til main.
# Krever at Pages er satt til «GitHub Actions» under Settings → Pages → Source.
name: Legg ut på GitHub Pages

on:
  push:
    branches: ["main"]
  # gjør at du også kan starte den for hånd fra Actions-fanen
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Hent koden
        uses: actions/checkout@v7
      - name: Sett opp Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Installer
        run: npm ci
      - name: Test
        run: npm test
      - name: Bygg
        run: npm run build
      - name: Sett opp Pages
        uses: actions/configure-pages@v6
      - name: Last opp
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./dist"
      - name: Legg ut
        id: deployment
        uses: actions/deploy-pages@v5
